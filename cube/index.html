<!DOCTYPE html><link rel=stylesheet href=/CaedenHarper.github.io.b611583e.css><title>Cubing Analyzer</title><link rel=stylesheet href=/cube.2ae97912.css><body>
        <div id=main_div>
            <div id=div-container class=sideways>
                <div id=summary-column class=column>
                    <div id=sample-label class=child></div>
                    
                    <div id=total_time class=child></div>
                    
                    <div id=total class=child></div>
                    
                    <div id=DNF class=child></div>
                    
                    <div id=plus_two class=child></div>
                    <div id=best_time class=child></div>
                    <div id=worst_time class=child></div>
                    <div id=mean class=child></div>
                    <div id=median class="child comparison-stat"></div>
                    <div id=consistency class="child comparison-stat"></div>
                    <div id=dnf-rate class="child comparison-stat"></div>
                    <div id=plus-two-rate class="child comparison-stat"></div>
                </div>
                <div id=avg class=column>
                    
                </div>
                <div id=streak class=column>
                    
                </div>
                <div id=graphs>
                    <div id=full-graph-box class=graph-box>
                        <canvas id=graph responsive=true></canvas>
                    </div>
                    <div id=selected-graph-box class=graph-box hidden>
                        <canvas id=selected-date-graph responsive=true></canvas>
                    </div>
                </div>
            </div>
            <div class=sideways>
                <div id=file-controls class=column>
                    <div>
                        <label for=file-input>Input a csv file:</label>
                        <input type=file id=file-input name=file-input accept=.csv>
                    </div>
                    <div id=date-controls>
                        <label for=date-input>Compare Date:</label>
                        <div class=date-input-row>
                            <button type=button id=previous-date-button class=date-button aria-label="Previous solve date" title="Previous solve date" disabled>←</button>
                            <input type=date id=date-input disabled>
                            <button type=button id=next-date-button class=date-button aria-label="Next solve date" title="Next solve date" disabled>→</button>
                            <button type=button id=clear-date-button class=date-button disabled>Clear</button>
                        </div>
                    </div>
                </div>
                <div class=column>
                    <textarea class=noscroll id=text-input autocomplete=off rows=10 cols=40 placeholder="paste here..."></textarea>
                </div>

                <div id=num-settings class="column settings">
                    <div class=setting-div>
                        Minimum Graph: 
                        <input type=number id=min-input min=0 placeholder=5>
                    </div>
                    <div class=setting-div>
                        Maximum Graph: 
                        <input type=number id=max-input min=0.001 placeholder=30>
                    </div>
                    <div class=setting-div>
                        Number of Solves: 
                        <input type=number id=numsolves-input placeholder=all>
                    </div>
                    <div class=setting-div>
                        Step By: 
                        <input type=number id=step-input min=1 placeholder=1>
                    </div>
                </div>
                <div id=list-settings class="column settings">
                    <div class=setting-div>
                        Average of N: 
                        <input id=average-input placeholder="5, 12, 100, 1000...">
                    </div>
                    <div class=setting-div>
                        Streak of Solves under N: 
                        <input id=streak-input placeholder="15, 20, 25, 30...">
                    </div>
                    <div class=setting-div>
                        Ignore DNFs?: &nbsp;
                        <input id=ignore-dnf-input type=checkbox>
                    </div>
                    <div class=setting-div>
                        Ignore +2s?: &nbsp;
                        <input id=ignore-plus-two-input type=checkbox>
                    </div>
                </div>
            </div>
        </div>
        <script type=module src=/cube.31297b3d.js></script>
